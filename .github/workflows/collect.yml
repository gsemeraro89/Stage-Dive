# Collector: a manual button ("Run workflow") with a dry-run option.
# The daily schedule is PAUSED (owner, 18 Nov 2026) until step 6 of the brief (dry run for the approved bands,
# report, owner's OK). To switch it back on, restore under "on:":
#   schedule:
#     - cron: "47 8 * * *"   # 08:47 UTC, just after YouTube's daily quota resets
# A scheduled run publishes only when the repository variable COLLECTOR_PUBLISH is true.
# Secrets (repository Settings -> Secrets and variables -> Actions):
#   DATABASE_URL (Render "External Database URL"), YOUTUBE_API_KEY, ANTHROPIC_API_KEY
# bootleg_check: a measuring dry run over the fan uploads the per-artist lane finds (never publishes).
# bootleg_publish: bootlegs for real, following dry_run (on = report only). Both read data/fan-channels.json in full.
# Optional variables: MAX_CLASSIFY_PER_RUN, YOUTUBE_UNIT_BUDGET. Claude has no cap (owner, 19 Nov 2026).
# Switch: COLLECTOR_PUBLISH = true lets the daily run publish; anything else = dry run (report only).
# No view threshold (brief section 2). Archives are read first (data/channels.json).
name: Collect concerts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: classify and report, publish nothing"
        type: boolean
        default: true
      limit:
        description: "Maximum videos to classify"
        default: "100"
      reconsider:
        description: "Look again at videos kept out as uncertain or not rock (free when answers are stored)"
        type: boolean
        default: false
      unit_budget:
        description: "YouTube quota units this run may use (default 8000)"
        default: ""
      new_channels:
        description: "New channels to look up in this run (default from data/channels.json: 8)"
        default: ""
      searches:
        description: "Artist searches in this run (100 quota units each; default 10; with artist_search: as many as the units allow)"
        default: ""
      no_batch:
        description: "Classify straight away at full price (default: half-price Batch API, answers within the hour)"
        type: boolean
        default: false
      recrawl:
        description: "Read every channel from its first upload again (one-off: remembers long videos of channels read before 14 Nov 2026)"
        type: boolean
        default: false
      recheck_long:
        description: "Look again at every remembered long video now (1 unit per 50 videos)"
        type: boolean
        default: false
      only_channel:
        description: "Read only this channel (name as in data/channels.json, e.g. Pinkpop Archive); no searches"
        default: ""
      similarity_only:
        description: "Only update similar artists (asks ListenBrainz; no YouTube quota, no Claude cost)"
        type: boolean
        default: false
      only_videos:
        description: "Decide again on just these YouTube IDs (comma-separated), e.g. after approving their artists; reuses stored answers"
        default: ""
      admin_ops:
        description: "Only run one-off fixes, e.g. merge:from-slug>into-slug;merge-venue:from-slug>into-slug;normalize-countries;tidy-review (no YouTube quota, no Claude cost)"
        default: ""
      artist_search:
        description: "Per-artist lane only: every official full concert of the bands marked allConcerts in data/artist-rules.json (respects dry_run)"
        type: boolean
        default: false
      haiku_test:
        description: "Only compare Claude Haiku with the stored Opus answers (about 185 videos; publishes nothing)"
        type: boolean
        default: false
      bootleg_check:
        description: "Fan uploads (bootlegs) of the listed bands: pro-shot, complete, one per concert. Measuring dry run only, publishes nothing (owner 20 Nov 2026)"
        type: boolean
        default: false
      bootleg_publish:
        description: "Bootlegs for real (pro-shot, complete, one per concert, official wins), fan sources of data/fan-channels.json read in full. Follows dry_run: dry_run on = report only (write-ups asked), off = stored"
        type: boolean
        default: false
      claude_budget:
        description: "Most Claude may cost in this run, in US dollars (artist_search / haiku_test; empty = no cap, owner 19 Nov 2026)"
        default: ""
      lane_classifier:
        description: "artist_search classifier: haiku (owner default), auto (follows the last Haiku test), or haiku+opus (Opus for Haiku answers below 0.75)"
        type: choice
        options: [haiku, auto, haiku+opus]
        default: haiku
      lane_sources:
        description: "artist_search sources (empty = long,channel,search,handles). Cheap pass: answers,matches (videos the lane already matched; skips the 26,800 long videos)"
        default: ""

concurrency:
  group: database-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The per-artist lane may wait for up to three half-price batches (classify, Opus check, write-ups).
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ONLY_CHANNEL: ${{ inputs.only_channel }}
      ONLY_VIDEOS: ${{ inputs.only_videos }}
      MAX_CLASSIFY_PER_RUN: ${{ vars.MAX_CLASSIFY_PER_RUN || '200' }}
      YOUTUBE_UNIT_BUDGET: ${{ inputs.unit_budget || vars.YOUTUBE_UNIT_BUDGET || '8000' }}
      NEW_CHANNELS_PER_RUN: ${{ inputs.new_channels }}
      DISCOVERY_SEARCHES: ${{ inputs.searches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: One-off fixes only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_ops }}
        env:
          ADMIN_OPS: ${{ inputs.admin_ops }}
        run: npm run admin-ops -- "$ADMIN_OPS"
      - name: Similar artists only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.similarity_only && !(inputs.admin_ops) }}
        run: npm run similarity
      - name: Artist search / Haiku test / bootleg check only
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.artist_search || inputs.haiku_test || inputs.bootleg_check || inputs.bootleg_publish) && !(inputs.similarity_only || inputs.admin_ops) }}
        env:
          CLAUDE_BUDGET_USD: ${{ inputs.claude_budget }}
          LANE_CLASSIFIER: ${{ inputs.lane_classifier }}
          LANE_SOURCES: ${{ inputs.lane_sources }}
          LANE_SEARCHES: ${{ inputs.searches }}
        run: |
          NO_BATCH=""
          if [ "${{ inputs.no_batch }}" = "true" ]; then NO_BATCH="--no-batch"; fi
          if [ "${{ inputs.bootleg_check }}" = "true" ]; then
            # Always a dry run: nothing is written to the concerts table.
            npm run artist-lane -- --bootleg-check $NO_BATCH
          elif [ "${{ inputs.bootleg_publish }}" = "true" ]; then
            # dry_run on: the report only (write-ups are asked and kept, so the real run pays nothing twice).
            DRY=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
            npm run artist-lane -- --bootleg-publish $DRY $NO_BATCH
          elif [ "${{ inputs.haiku_test }}" = "true" ]; then
            npm run artist-lane -- --haiku-test $NO_BATCH
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run artist-lane -- --dry-run $NO_BATCH
          else
            npm run artist-lane -- $NO_BATCH
          fi
      - name: Collect
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.similarity_only || inputs.artist_search || inputs.haiku_test || inputs.bootleg_check || inputs.bootleg_publish) || (inputs.admin_ops)) }}
        # Scheduled runs only publish once the owner sets the repository variable COLLECTOR_PUBLISH to "true"
        # (Settings -> Secrets and variables -> Actions -> Variables). Until then they are dry runs.
        run: |
          NO_BATCH=""
          if [ "${{ inputs.no_batch }}" = "true" ]; then NO_BATCH="--no-batch"; fi
          if [ "${{ inputs.reconsider }}" = "true" ]; then NO_BATCH="$NO_BATCH --reconsider"; fi
          if [ "${{ inputs.recrawl }}" = "true" ]; then NO_BATCH="$NO_BATCH --recrawl"; fi
          if [ "${{ inputs.recheck_long }}" = "true" ]; then NO_BATCH="$NO_BATCH --recheck-long"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.COLLECTOR_PUBLISH }}" != "true" ]; then
            npm run collect -- --dry-run
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run collect -- --dry-run --limit "${{ inputs.limit }}" $NO_BATCH
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run collect -- --limit "${{ inputs.limit }}" $NO_BATCH
          else
            npm run collect
          fi
      - name: Artist profiles (short bios for new artists)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.similarity_only || inputs.haiku_test || inputs.bootleg_check || (inputs.admin_ops))) && !(github.event_name == 'schedule' && vars.COLLECTOR_PUBLISH != 'true') }}
        run: npm run profiles
      - name: Entity links (MusicBrainz, Wikidata and Wikipedia for band pages; open data, no quota)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.similarity_only || inputs.haiku_test || inputs.bootleg_check || (inputs.admin_ops))) && !(github.event_name == 'schedule' && vars.COLLECTOR_PUBLISH != 'true') }}
        continue-on-error: true
        run: npm run entity-links
      - name: Artist pictures (official YouTube channel avatars)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.similarity_only || inputs.haiku_test || inputs.bootleg_check || (inputs.admin_ops))) && !(github.event_name == 'schedule' && vars.COLLECTOR_PUBLISH != 'true') }}
        run: npm run artist-images
      - name: Similar artists (recompute with the new sets)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.similarity_only || inputs.haiku_test || inputs.bootleg_check || (inputs.admin_ops))) && !(github.event_name == 'schedule' && vars.COLLECTOR_PUBLISH != 'true') }}
        run: npm run similarity -- --no-fetch
      - name: Announce new pages to search engines (IndexNow; skipped until the live site is open)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.similarity_only || inputs.haiku_test || inputs.bootleg_check || (inputs.admin_ops))) && !(github.event_name == 'schedule' && vars.COLLECTOR_PUBLISH != 'true') }}
        continue-on-error: true
        env:
          LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}
        run: npm run indexnow
      - name: Keep the report (deleted after 30 days, YouTube storage rule)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
