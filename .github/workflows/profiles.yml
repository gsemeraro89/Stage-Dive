# Short artist bios (origin, birth year, style). Also runs after each publishing collector run.
name: Artist profiles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum artists to write"
        default: "25"

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run profiles -- --limit "${{ inputs.limit }}"
