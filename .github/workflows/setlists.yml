# Measures how many published sets have a readable setlist (description or comments).
# Read-only: saves nothing to the database. The result is on the run's summary page.
name: Setlist coverage

on:
  workflow_dispatch:
    inputs:
      use_claude:
        description: "Also ask Claude about texts the rules could not read (small cost)"
        type: boolean
        default: false
      limit:
        description: "Only the N most viewed sets (empty = all)"
        default: ""

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_UNIT_BUDGET: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: >-
          npm run setlists --
          ${{ inputs.use_claude && '--claude' || '' }}
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setlist-report
          path: setlist-report.json
          retention-days: 7
