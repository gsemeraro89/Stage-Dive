# Daily database backup (owner, 22 Nov 2026, after the Neon free-plan block), kept as a private download of this repository for 30 days (YouTube storage rule).
# The database is a Neon Postgres 18 project: pg_dump must be the same major version or newer.
# To move or recover it, restore the latest backup into the new database (see README, "Restore a backup").
name: Back up database

on:
  schedule:
    - cron: "29 2 * * *" # every day at 02:29 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # A secret pasted with a trailing line break or spaces breaks pg_dump ("invalid channel_binding
          # value"); strip whitespace from the address first.
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '[:space:]')"
          export DATABASE_URL
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump --no-owner --no-privileges --format=custom "$DATABASE_URL"' > stagedive.dump
          test -s stagedive.dump
      - name: Plain SQL copy
        # The same backup as plain SQL (gzip), readable by older Postgres tools too (psql of any version):
        # used to load the data into a local database for checks and screenshots.
        run: |
          docker run --rm -v "$PWD:/w" postgres:18 pg_restore --no-owner --no-privileges -f /w/stagedive.sql /w/stagedive.dump
          gzip -9 stagedive.sql
          test -s stagedive.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: stagedive-db-${{ github.run_id }}
          path: |
            stagedive.dump
            stagedive.sql.gz
          retention-days: 30
